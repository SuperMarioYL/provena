<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provena — claim-to-source graph</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #16181d;
      --ink: #f5f5f7;
      --muted: #a1a1a8;
      --claim: #8985ff;
      --source: #2dc79a;
      --stale: #ff5c5c;
      --edge: #3a3a44;
      --brand: #4da3ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7;
        --panel: #ffffff;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --edge: #c9c9d0;
        --claim: #5e5ce6;
        --source: #10a37f;
        --stale: #d63333;
        --brand: #0071e3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--edge);
      background: var(--panel);
    }
    header .logo { font-weight: 700; font-size: 18px; color: var(--brand); }
    header .sub { color: var(--muted); font-size: 13px; }
    header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
    header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--source); margin-right: 6px; vertical-align: middle; }
    main { flex: 1; display: flex; min-height: 0; }
    #graph { flex: 1; background: var(--bg); }
    aside {
      width: 360px;
      border-left: 1px solid var(--edge);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
      font-size: 13px;
    }
    aside h2 { margin: 0 0 8px; font-size: 14px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; }
    .trace-empty { color: var(--muted); }
    .trace-claim { font-weight: 600; margin-bottom: 4px; }
    .trace-row { margin: 2px 0 2px 4px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 11px; font-weight: 600; }
    .badge.stale { background: var(--stale); color: #fff; }
    .badge.fresh { background: var(--source); color: #fff; }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
      margin-right: 5px; vertical-align: middle; }
    a { color: var(--brand); }
  </style>
</head>
<body>
  <header>
    <span class="logo">Provena</span>
    <span class="sub">claim → source dependency graph</span>
    <span class="legend">
      <span><i style="background: var(--claim)"></i>claim</span>
      <span><i style="background: var(--source)"></i>source</span>
      <span><i style="background: var(--stale)"></i>stale</span>
    </span>
    <span class="status"><span class="dot"></span><span id="status-text">live</span></span>
  </header>
  <main>
    <div id="graph"></div>
    <aside id="trace">
      <h2>Inspect</h2>
      <div class="trace-empty">Click a node to see its provenance.</div>
    </aside>
  </main>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
