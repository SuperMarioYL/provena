O / STEP 01</text><text x="36" y="89.0" fill="#f3fdee" font-size="28" text-anchor="start" font-weight="400">Recorded run</text><text x="36" y="148.0" fill="#95b9a9" font-size="19" text-anchor="start" font-weight="400">A temporary source file changes from limit=10 to limit=20,</text><text x="36" y="174.6" fill="#95b9a9" font-size="19" text-anchor="start" font-weight="400">causing two explicit dependent claims to become stale. No model</text><text x="36" y="201.2" fill="#95b9a9" font-size="19" text-anchor="start" font-weight="400">re-derivation.</text><path d="M36 236H724" stroke="#173c1f"/><text x="36" y="272.0" fill="#56e65e" font-size="16" text-anchor="start" font-weight="400">.venv/bin/python examples/presentation-demo.py</text></svg>
