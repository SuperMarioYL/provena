<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Provena architecture: source spans -> claim-to-source graph -> cascade engine -> graph UI + alert webhook, with a file-mutation watcher feeding the cascade">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- base connectors (static) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="220" y1="180" x2="350" y2="180" marker-end="url(#ah-l)"/>
    <line x1="530" y1="180" x2="660" y2="180" marker-end="url(#ah-l)"/>
    <line x1="440" y1="272" x2="440" y2="220" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (direction = real data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="220" y1="180" x2="344" y2="180" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="654" y2="180" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="272" x2="440" y2="226" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets along connectors -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M220,180 L344,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M530,180 L654,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M440,272 L440,226" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing fill-opacity 0.10<->0.18, staggered) -->
  <g>
    <rect x="40" y="140" width="180" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">Source spans</text>
    <text x="130" y="192" text-anchor="middle" font-size="11" fill="#6E6E73">file · model · web</text>

    <rect x="350" y="140" width="180" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">Provena core</text>
    <text x="440" y="192" text-anchor="middle" font-size="11" fill="#6E6E73">claim→source · cascade-flag</text>

    <rect x="660" y="140" width="180" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Graph UI + alert</text>
    <text x="750" y="192" text-anchor="middle" font-size="11" fill="#6E6E73">flagged · webhook</text>

    <rect x="370" y="272" width="140" height="48" rx="12" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B53">watchfiles watcher</text>
    <text x="440" y="314" text-anchor="middle" font-size="9" fill="#6E6E73">source mutation</text>
  </g>
</svg>
