[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "provena"
version = "0.1.0"
description = "Record claim-to-source dependencies and mark downstream claims stale when tracked source content changes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "supermario_leo" }]
keywords = ["provenance", "agents", "llm", "cascade", "invalidation", "dag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchfiles>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
provena = "provena.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/provena"
Issues = "https://github.com/SuperMarioYL/provena/issues"

[tool.hatch.build.targets.wheel]
packages = ["provena"]

[tool.hatch.build.targets.sdist]
include = ["provena", "tests", "README.md", "README.en.md", "LICENSE", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
