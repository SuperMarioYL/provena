<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="56e65e-6ae7b3-c4f6ac-b58619bbb2e0" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">provena process</title><desc id="process-light-desc">Changing the source marks both limit and request claims stale.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#318336"/><stop offset=".6" stop-color="#3b8064"/><stop offset="1" stop-color="#627a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#318336" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbf7ce" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#318336" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#f9fef9"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#557b6c" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#132a1d" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M332.0 237H356.0" fill="none" stroke="#318336" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#627a56" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cbf7ce"/><text x="62.0" y="207.0" fill="#132a1d" font-size="21" text-anchor="start" font-weight="400">01  Record source</text><text x="62.0" y="259.0" fill="#557b6c" font-size="17" text-anchor="start" font-weight="400">limit=10</text><path d="M644.0 237H668.0" fill="none" stroke="#318336" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#627a56" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cbf7ce"/><text x="374.0" y="207.0" fill="#132a1d" font-size="21" text-anchor="start" font-weight="400">02  Connect claims</text><text x="374.0" y="259.0" fill="#557b6c" font-size="17" text-anchor="start" font-weight="400">Direct and transitive</text><text x="374.0" y="282.8" fill="#557b6c" font-size="17" text-anchor="start" font-weight="400">dependents</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#f7fef7" stroke="#cbf7ce"/><text x="686.0" y="207.0" fill="#132a1d" font-size="21" text-anchor="start" font-weight="400">03  Change source</text><text x="686.0" y="259.0" fill="#557b6c" font-size="17" text-anchor="start" font-weight="400">Both claims become stale</text><text x="44" y="379.0" fill="#627a56" font-size="20" text-anchor="start" font-weight="400">Changing the source marks both limit and request claims stale.</text></svg>
